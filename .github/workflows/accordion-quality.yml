name: Accordion quality checks

on:
  push:
    paths:
      - "faq-accordion-react/**"
      - ".github/workflows/accordion-quality.yml"
  pull_request:
    paths:
      - "faq-accordion-react/**"
      - ".github/workflows/accordion-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faq-accordion-react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: faq-accordion-react/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and accessibility tests
        run: npm test

      - name: Build playground and TypeScript library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
