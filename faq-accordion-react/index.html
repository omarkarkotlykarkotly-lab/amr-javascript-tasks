<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1330">
  <meta name="description" content="Interactive playground for an accessible, customizable React Accordion component library. Tune props, explore React interview questions, and copy the usage example.">
  <title>Accordion Component Library — Interactive Playground</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("accordion-demo-theme");
        var preferredTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : preferredTheme;
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script type="importmap">
    {

        "react": "https://esm.sh/react@19.1.0",

      }
    }
  </script>
  <script type="module" src="./src/main.js?v=5"></script>
